# =============================================================================
# Kubernetes — Redis (Deployment + Service + PVC)
# =============================================================================
# Single-instance Redis with AOF persistence. For production, consider
# Redis Sentinel or a managed service (ElastiCache).
# =============================================================================

# ---------------------------------------------------------------------------
# PersistentVolumeClaim — Redis data persistence
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: crowd-mind
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: crowd-mind
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3

---
# ---------------------------------------------------------------------------
# Deployment — Redis
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: crowd-mind
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: crowd-mind
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate  # Single replica — Recreate to avoid dual-write on PVC
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - "60 1000"
            - "--save"
            - "300 100"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 640Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Redis needs to write AOF/RDB files
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

---
# ---------------------------------------------------------------------------
# Service — Redis
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: crowd-mind
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: crowd-mind
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

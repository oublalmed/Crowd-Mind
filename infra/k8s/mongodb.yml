# =============================================================================
# Kubernetes — MongoDB (StatefulSet + Service + ConfigMap + Secret)
# =============================================================================
# StatefulSet ensures stable network identities and persistent storage.
# For production, consider using a managed service (DocumentDB, MongoDB Atlas)
# or an operator (e.g., MongoDB Community Operator).
# =============================================================================

# ---------------------------------------------------------------------------
# ConfigMap — MongoDB configuration
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: crowd-mind
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: crowd-mind
data:
  MONGO_INITDB_DATABASE: crowdmind

---
# ---------------------------------------------------------------------------
# Secret — MongoDB credentials (CHANGE_ME in production!)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: crowd-mind
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: crowd-mind
  annotations:
    description: "MongoDB credentials — CHANGE_ME: replace with real secrets"
type: Opaque
data:
  # Base64 encoded: "CHANGE_ME_mongo_root_user"
  MONGO_INITDB_ROOT_USERNAME: Q0hBTkdFX01FX21vbmdvX3Jvb3RfdXNlcg==
  # Base64 encoded: "CHANGE_ME_mongo_root_password"
  MONGO_INITDB_ROOT_PASSWORD: Q0hBTkdFX01FX21vbmdvX3Jvb3RfcGFzc3dvcmQ=

---
# ---------------------------------------------------------------------------
# Service — MongoDB (headless for StatefulSet)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: crowd-mind
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: crowd-mind
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP

---
# ---------------------------------------------------------------------------
# StatefulSet — MongoDB
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: crowd-mind
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: crowd-mind
    app.kubernetes.io/component: database
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/name: mongodb
    spec:
      securityContext:
        runAsNonRoot: false   # MongoDB requires root for initial setup
        fsGroup: 999          # mongodb group
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:7-jammy
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: mongodb-config
            - secretRef:
                name: mongodb-secret
          # Liveness: can MongoDB accept connections?
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness: is MongoDB ready to serve queries?
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  # PersistentVolumeClaim template — 10Gi storage
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app: mongodb
          app.kubernetes.io/name: mongodb
          app.kubernetes.io/part-of: crowd-mind
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: gp3

# =============================================================================
# Kubernetes — Game Engine (Deployment + Service + HPA)
# =============================================================================
# The game-engine handles real-time WebSocket connections for live gameplay.
# Sticky sessions are required so that WebSocket upgrades route to the same pod.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-engine
  namespace: crowd-mind
  labels:
    app: game-engine
    app.kubernetes.io/name: game-engine
    app.kubernetes.io/part-of: crowd-mind
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: game-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: game-engine
        app.kubernetes.io/name: game-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: crowd-mind-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: game-engine
      # Graceful shutdown: allow time for WebSocket connections to drain
      terminationGracePeriodSeconds: 60
      containers:
        - name: game-engine
          image: crowd-mind/game-engine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: websocket
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: crowd-mind-config
            - secretRef:
                name: crowd-mind-secrets
          env:
            - name: SERVICE_NAME
              value: "game-engine"
            - name: PORT
              value: "3000"
            - name: WS_PORT
              value: "8080"
          # Liveness: is the process alive?
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: can it accept traffic?
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup: give the service time to boot
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Pre-stop hook: allow in-flight WebSocket connections to close gracefully
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# =============================================================================
# Service — game-engine
# =============================================================================
# Session affinity is enabled for WebSocket sticky sessions. Clients connecting
# via WebSocket need to consistently hit the same backend pod.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: game-engine
  namespace: crowd-mind
  labels:
    app: game-engine
    app.kubernetes.io/name: game-engine
    app.kubernetes.io/part-of: crowd-mind
  annotations:
    # Sticky sessions for WebSocket support
    service.beta.kubernetes.io/aws-load-balancer-stickiness-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-stickiness-type: "source_ip"
spec:
  type: ClusterIP
  # Enable session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: game-engine
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: websocket
      port: 8080
      targetPort: websocket
      protocol: TCP
---
# =============================================================================
# HorizontalPodAutoscaler — game-engine
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-engine
  namespace: crowd-mind
  labels:
    app: game-engine
    app.kubernetes.io/name: game-engine
    app.kubernetes.io/part-of: crowd-mind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

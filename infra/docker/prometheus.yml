# =============================================================================
# Prometheus Configuration — Crowd-Mind Services
# =============================================================================
# All services expose metrics at GET /metrics (prom-client / OpenTelemetry).
# This config scrapes each service every 15 seconds in the local dev environment.
# =============================================================================

global:
  scrape_interval: 15s          # Default scrape interval
  evaluation_interval: 15s      # Rule evaluation interval
  scrape_timeout: 10s           # Per-target timeout

  external_labels:
    environment: "development"
    project: "crowd-mind"

# ---------------------------------------------------------------------------
# Scrape Configurations
# ---------------------------------------------------------------------------
scrape_configs:

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # --- Application Services ---

  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:3000"]
        labels:
          service: "auth-service"

  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:3000"]
        labels:
          service: "user-service"

  - job_name: "game-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["game-engine:3000"]
        labels:
          service: "game-engine"

  - job_name: "voting-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["voting-service:3000"]
        labels:
          service: "voting-service"

  - job_name: "leaderboard"
    metrics_path: /metrics
    static_configs:
      - targets: ["leaderboard:3000"]
        labels:
          service: "leaderboard"

  - job_name: "payment-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:3000"]
        labels:
          service: "payment-service"

  - job_name: "analytics"
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics:3000"]
        labels:
          service: "analytics"

  - job_name: "notification"
    metrics_path: /metrics
    static_configs:
      - targets: ["notification:3000"]
        labels:
          service: "notification"

  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: "api-gateway"
